name: SIMD RISCVV Native Evidence

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  FAFAFA_BUILD_MODE: Release
  FPC_RISCV64_SNAPSHOT_URL: https://downloads.freepascal.org/fpc/snapshot/trunk/riscv64-linux/fpc-3.3.1.riscv64-linux.tar.gz

jobs:
  collect-riscvv-native-evidence:
    runs-on:
      - self-hosted
      - Linux
      - riscv64
    name: Collect RISCVV Native Evidence
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install RISCV64 FPC 3.3.1 snapshot
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            ca-certificates \
            curl \
            gzip \
            libc6-dev \
            tar

          sudo mkdir -p /opt/fpc
          curl -L --retry 5 --retry-delay 2 --speed-limit 500 --speed-time 120 \
            -o /tmp/fpc-riscv64.tar.gz "${FPC_RISCV64_SNAPSHOT_URL}"
          sudo tar -xzf /tmp/fpc-riscv64.tar.gz -C /opt/fpc
          sudo ln -sf /opt/fpc/bin/fpc /usr/local/bin/fpc
          sudo ln -sf /opt/fpc/lib/fpc/3.3.1/ppcrv64 /usr/local/bin/ppcrv64
          printf '%s\n' '-Fu/opt/fpc/lib/fpc/3.3.1/units/riscv64-linux/*' | sudo tee /etc/fpc.cfg >/dev/null
          printf '%s\n' '-Fl/opt/fpc/lib/fpc/3.3.1/units/riscv64-linux/rtl' | sudo tee -a /etc/fpc.cfg >/dev/null
          rm -f /tmp/fpc-riscv64.tar.gz
          fpc -iV
          fpc -iTP
          fpc -iTO

      - name: Collect RISCVV native evidence
        env:
          SIMD_OUTPUT_ROOT: ${{ runner.temp }}/simd-riscvv-native-evidence
          SIMD_NATIVE_EVIDENCE_RUNNER: direct-fpc
          SIMD_NATIVE_EVIDENCE_ENABLE_BACKEND_ASM: 1
        run: |
          bash tests/fafafa.core.simd/collect_nonx86_native_evidence.sh riscvv

      - name: Upload RISCVV native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simd-riscvv-native-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/simd-riscvv-native-evidence/logs/native-evidence-riscvv-*
