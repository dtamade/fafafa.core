name: L0 Windows Native Evidence

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  collect-l0-windows-native-evidence:
    runs-on: windows-latest
    name: Collect L0 Windows Native Evidence
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install FreePascal + Lazarus
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Install-ChocoPackage([string]$name) {
            $attempts = 3
            for ($i = 1; $i -le $attempts; $i++) {
              Write-Host "[CHOCO] install $name attempt $i/$attempts"
              & choco install $name --yes --no-progress
              if ($LASTEXITCODE -eq 0) {
                Write-Host "[CHOCO] OK: $name"
                return
              }
              if ($i -lt $attempts) {
                $sleep = 10 * $i
                Write-Host "[CHOCO] RETRY in ${sleep}s (exit=$LASTEXITCODE)"
                Start-Sleep -Seconds $sleep
              } else {
                throw "[CHOCO] Failed installing $name after $attempts attempts (exit=$LASTEXITCODE)"
              }
            }
          }

          Install-ChocoPackage 'freepascal'
          Install-ChocoPackage 'lazarus'

      - name: Resolve lazbuild path
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Lazarus\lazbuild.exe",
            'C:\lazarus\lazbuild.exe',
            'C:\tools\lazarus\lazbuild.exe'
          )
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              "LAZBUILD_EXE=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Split-Path $candidate -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "[LAZBUILD] Using $candidate"
              exit 0
            }
          }
          Write-Host '[LAZBUILD] lazbuild.exe not found in common paths; probing C:\ ...'
          Get-ChildItem -Path C:\ -Filter lazbuild.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 20 -ExpandProperty FullName
          throw 'lazbuild.exe not found'

      - name: Set evidence batch id
        shell: pwsh
        run: |
          $batch = "L0-GHA-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          "L0_WINDOWS_EVIDENCE_BATCH_ID=$batch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "[L0-NATIVE] batch id: $batch"

      - name: Collect native evidence
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\tests\collect_windows_strict_l0_native_evidence.bat"
          if errorlevel 1 exit /b 1

      - name: Verify native evidence
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\tests\verify_windows_strict_l0_native_evidence.bat" "%GITHUB_WORKSPACE%\tests\_windows_l0_native_evidence\%L0_WINDOWS_EVIDENCE_BATCH_ID%"

      - name: Upload native evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l0-windows-native-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            tests/_windows_l0_native_evidence/${{ env.L0_WINDOWS_EVIDENCE_BATCH_ID }}
