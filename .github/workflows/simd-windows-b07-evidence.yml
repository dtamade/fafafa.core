name: SIMD Windows B07 Evidence

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'src/fafafa.core.simd*.pas'
      - 'src/fafafa.core.simd*.inc'
      - 'tests/fafafa.core.simd/**'

permissions:
  contents: read

env:
  FAFAFA_BUILD_MODE: Release

jobs:
  prepare-windows-b07-source:
    runs-on: ubuntu-latest
    name: Prepare Windows SIMD Source
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage SIMD source subset
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${GITHUB_WORKSPACE}"
          STAGE="${RUNNER_TEMP}/simd-windows-b07-source"

          rm -rf "${STAGE}"
          mkdir -p "${STAGE}/tests"

          cp -a "${ROOT}/src" "${STAGE}/"
          cp -a "${ROOT}/docs" "${STAGE}/"
          cp -a "${ROOT}/tests/fafafa.core.simd" "${STAGE}/tests/"
          cp -a "${ROOT}/tests/fafafa.core.simd.cpuinfo" "${STAGE}/tests/"
          cp -a "${ROOT}/tests/fafafa.core.simd.cpuinfo.x86" "${STAGE}/tests/"
          if [[ -d "${ROOT}/tests/fafafa.core.simd.publicabi" ]]; then
            cp -a "${ROOT}/tests/fafafa.core.simd.publicabi" "${STAGE}/tests/"
          fi
          if [[ -d "${ROOT}/tests/fafafa.core.simd.intrinsics.sse" ]]; then
            cp -a "${ROOT}/tests/fafafa.core.simd.intrinsics.sse" "${STAGE}/tests/"
          fi
          if [[ -d "${ROOT}/tests/fafafa.core.simd.intrinsics.mmx" ]]; then
            cp -a "${ROOT}/tests/fafafa.core.simd.intrinsics.mmx" "${STAGE}/tests/"
          fi
          if [[ -d "${ROOT}/tests/fafafa.core.simd.intrinsics.experimental" ]]; then
            cp -a "${ROOT}/tests/fafafa.core.simd.intrinsics.experimental" "${STAGE}/tests/"
          fi
          cp "${ROOT}/tests/run_all_tests.bat" "${STAGE}/tests/"
          if [[ -f "${ROOT}/tests/run_all_tests.sh" ]]; then
            cp "${ROOT}/tests/run_all_tests.sh" "${STAGE}/tests/"
          fi
          if [[ -f "${ROOT}/tests/check_repo_hygiene.sh" ]]; then
            cp "${ROOT}/tests/check_repo_hygiene.sh" "${STAGE}/tests/"
          fi
          cp "${ROOT}/tests/test_windows_simd_cpuinfo_x86_batch_build_success_criteria.sh" "${STAGE}/tests/"

      - name: Upload staged SIMD source
        uses: actions/upload-artifact@v4
        with:
          name: simd-windows-b07-source
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/simd-windows-b07-source

  collect-windows-b07-evidence:
    needs: prepare-windows-b07-source
    runs-on: windows-latest
    name: Collect Windows B07 Evidence
    timeout-minutes: 60

    steps:
      - name: Download prepared SIMD source
        uses: actions/download-artifact@v4
        with:
          name: simd-windows-b07-source
          path: ${{ github.workspace }}

      - name: Install FreePascal + Lazarus
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Install-ChocoPackage([string]$name) {
            $attempts = 3
            for ($i = 1; $i -le $attempts; $i++) {
              Write-Host "[CHOCO] install $name attempt $i/$attempts"
              & choco install $name --yes --no-progress
              if ($LASTEXITCODE -eq 0) {
                Write-Host "[CHOCO] OK: $name"
                return
              }
              if ($i -lt $attempts) {
                $sleep = 10 * $i
                Write-Host "[CHOCO] RETRY in ${sleep}s (exit=$LASTEXITCODE)"
                Start-Sleep -Seconds $sleep
              } else {
                throw "[CHOCO] Failed installing $name after $attempts attempts (exit=$LASTEXITCODE)"
              }
            }
          }

          Install-ChocoPackage 'freepascal'
          Install-ChocoPackage 'lazarus'

      - name: Resolve lazbuild path
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Lazarus\lazbuild.exe",
            'C:\lazarus\lazbuild.exe',
            'C:\tools\lazarus\lazbuild.exe'
          )
          $bashCandidates = @(
            'C:\Program Files\Git\bin',
            'C:\Program Files\Git\usr\bin',
            'C:\msys64\usr\bin'
          )
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              "LAZBUILD=lazbuild.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "LAZBUILD_RESOLVED=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Split-Path $candidate -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $fpcDir = 'C:\lazarus\fpc\3.2.2\bin\x86_64-win64'
              if (Test-Path $fpcDir) {
                $fpcDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                Write-Host "[FPC] Added $fpcDir to PATH"
              }
              $bashFound = $false
              $resolvedBashPath = $null
              foreach ($bashDir in $bashCandidates) {
                $candidateBash = Join-Path $bashDir 'bash.exe'
                if (Test-Path $candidateBash) {
                  $bashDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                  Write-Host "[BASH] Added $bashDir to PATH"
                  if (-not $resolvedBashPath) {
                    $resolvedBashPath = $candidateBash
                  }
                  $bashFound = $true
                }
              }
              if (-not $bashFound) {
                $bashPath = Get-ChildItem -Path C:\ -Filter bash.exe -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -notlike 'C:\Windows\System32\*' } |
                  Select-Object -First 1 -ExpandProperty FullName
                if ($bashPath) {
                  $bashDir = Split-Path $bashPath -Parent
                  $bashDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                  Write-Host "[BASH] Added discovered path $bashDir"
                  $resolvedBashPath = $bashPath
                } else {
                  Write-Host '[BASH] bash.exe not found on runner'
                }
              }
              if ($resolvedBashPath) {
                "SIMD_WIN_EVIDENCE_BASH_CMD=$resolvedBashPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                Write-Host "[BASH] Exported SIMD_WIN_EVIDENCE_BASH_CMD=$resolvedBashPath"
              }
              Write-Host "[LAZBUILD] Added $(Split-Path $candidate -Parent) to PATH"
              Write-Host "[LAZBUILD] Exported LAZBUILD=lazbuild.exe"
              Write-Host "[LAZBUILD] Resolved source path $candidate"
              exit 0
            }
          }
          Write-Host '[LAZBUILD] lazbuild.exe not found in common paths; probing C:\ ...'
          Get-ChildItem -Path C:\ -Filter lazbuild.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 20 -ExpandProperty FullName
          throw 'lazbuild.exe not found'

      - name: Prepare python3 shim
        shell: pwsh
        run: |
          $shimDir = Join-Path $env:RUNNER_TEMP 'simd-win-shims'
          New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
          @'
          @echo off
          python %*
          '@ | Out-File -FilePath (Join-Path $shimDir 'python3.cmd') -Encoding ascii
          $shimDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "[SHIM] Added $shimDir to PATH"

      - name: Collect and Verify Windows Evidence
        shell: cmd
        run: |
          echo [DEBUG] workspace=%GITHUB_WORKSPACE%
          dir tests
          dir tests\fafafa.core.simd
          set "SIMD_SCRIPT_ROOT=%GITHUB_WORKSPACE%\tests\fafafa.core.simd\"
          set "SIMD_WIN_EVIDENCE_USE_BASH_GATE=1"
          set "PYTHONUTF8=1"
          call "%GITHUB_WORKSPACE%\tests\fafafa.core.simd\collect_windows_b07_evidence.bat"
          if errorlevel 1 exit /b 1
          call "%GITHUB_WORKSPACE%\tests\fafafa.core.simd\verify_windows_b07_evidence.bat" "%GITHUB_WORKSPACE%\tests\fafafa.core.simd\logs\windows_b07_gate.log"

      - name: Upload Windows Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simd-windows-b07-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            tests/fafafa.core.simd/logs/windows_b07_gate.log
            tests/fafafa.core.simd/logs/gate_summary.md
            tests/fafafa.core.simd/logs/gate_summary.json
            tests/fafafa.core.simd/logs/build.txt
            tests/fafafa.core.simd/logs/test.txt
            tests/run_all_tests_summary.txt
